name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vetcare
          POSTGRES_PASSWORD: vetcare
          POSTGRES_DB: vetcare24_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vetcare" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vetcare:vetcare@localhost:5432/vetcare24_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas unitarias + integración (cobertura mínima 80 %)
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Exportar contrato OpenAPI
        run: python scripts/exportar_openapi.py docs/api/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            coverage.xml
            docs/api/openapi.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen de la API
        run: docker build --target app -t vetcare24:${{ github.sha }} .
      - name: Pruebas dentro de Docker Compose
        run: docker compose run --rm tests

  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Disparar despliegue en Render (deploy hook)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo "Sin RENDER_DEPLOY_HOOK: se omite el despliegue"; exit 0; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
